<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイムカード集計</title>
<link rel="icon" type="image/png" href="https://sanmi-dev.github.io/sanmi-apps/timecard-icon.png">
<link rel="apple-touch-icon" href="https://sanmi-dev.github.io/sanmi-apps/timecard-icon.png">
<meta name="msapplication-TileImage" content="https://sanmi-dev.github.io/sanmi-apps/timecard-icon.png">
<meta name="msapplication-TileColor" content="#7a4a2b">
<meta name="theme-color" content="#7a4a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タイムカード集計">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
       background:#f4ece0;color:#3a2a1c;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:360px;width:100%;text-align:center;}
  .icon{width:88px;height:88px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  h1{font-size:19px;margin:18px 0 4px;}
  .sub{color:#8a7560;font-size:13px;margin-bottom:24px;line-height:1.6;}
  .open{display:inline-block;width:100%;background:#7a4a2b;color:#fff;border:none;font-size:16px;
        font-weight:600;padding:14px 20px;border-radius:10px;cursor:pointer;text-decoration:none;font-family:inherit;}
  .open:hover{background:#5e3820;}
  .hint{margin-top:22px;background:#fffaf3;border:1px solid #e0d2be;border-radius:10px;
        padding:14px 16px;font-size:12.5px;color:#8a7560;line-height:1.7;text-align:left;}
  .hint b{color:#3a2a1c;}
  .redirecting{color:#8a7560;font-size:14px;margin-top:20px;}
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="https://sanmi-dev.github.io/sanmi-apps/timecard-icon.png" alt="">
    <h1>タイムカード集計</h1>
    <p class="sub">タイムカードを撮影して<br>勤怠集計表を自動作成</p>
    <a class="open" id="openBtn" href="https://script.google.com/macros/s/AKfycbx9TsAXtli08_XOFGUAkZxfCERxv2acolLmrF7scjyB2bCdDog1ihQRVd29SsEfWu9XqA/exec">アプリを開く</a>
    <div class="hint" id="hint">
      <b>iPhone：</b>ホーム画面にアイコンを置くには、下の「共有」ボタン
      → <b>「ホーム画面に追加」</b>を選んでください。次回からこのアイコンで開けます。
    </div>
    <p class="redirecting" id="redirecting" style="display:none;">アプリを開いています…</p>
  </div>
<script>
  var EXEC = document.getElementById('openBtn').getAttribute('href');
  var standalone = window.navigator.standalone === true
                || window.matchMedia('(display-mode: standalone)').matches;
  if (standalone) {
    document.getElementById('hint').style.display = 'none';
    document.getElementById('redirecting').style.display = 'block';
    window.location.replace(EXEC);
  }
</script>
</body>
</html>
