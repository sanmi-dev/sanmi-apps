<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アプリ集約（開発テスト用）— SANMI</title>
<link rel="icon" type="image/png" href="https://sanmi-dev.github.io/sanmi-apps/hub-icon.png">
<link rel="apple-touch-icon" href="https://sanmi-dev.github.io/sanmi-apps/hub-icon.png">
<meta name="theme-color" content="#7a4a2b">
<style>
  :root{
    --accent:#7a4a2b; --bg:#f4ece0; --card:#fffaf3; --line:#e0d2be; --text:#3a2a1c; --muted:#8a7560; --danger:#a8462b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
       background:var(--bg);color:var(--text);padding:24px 16px;}
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  h1 img{width:27px;height:27px;border-radius:7px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.6;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 12px;
        text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;
        align-items:center;gap:8px;transition:box-shadow .15s,transform .15s;}
  a.card:hover{box-shadow:0 4px 14px rgba(122,74,43,.18);transform:translateY(-2px);}
  .card.disabled{opacity:.5;cursor:default;}
  .icon{width:56px;height:56px;border-radius:14px;box-shadow:0 1px 5px rgba(122,74,43,.15);background:var(--line);}
  .icon.ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;box-shadow:none;}
  .name{font-size:13.5px;font-weight:600;line-height:1.4;}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;}
  .ok{background:#e4ddc9;color:var(--accent);}
  .no{background:var(--line);color:var(--muted);}
  .foot{margin-top:24px;color:var(--muted);font-size:11.5px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="https://sanmi-dev.github.io/sanmi-apps/hub-icon.png" alt="">アプリ集約ページ</h1>
  <p class="sub">開発・スマホ試験用。カードをタップすると各アプリのランチャーが開きます。<br>iPhoneは各ランチャーを個別に「ホーム画面に追加」してください。</p>
  <div class="grid" id="grid"></div>
  <p class="foot">
    ● = ランチャー公開済み ／ 灰色 = ランチャー未作成（アプリのデプロイ後に追加）。<br>
    このページは公開情報（アイコン・ランチャーリンク）のみ。GASプロジェクトID等の内部情報は含みません。
  </p>
</div>

<script>
  // launcher:true = {short}.html を公開済み（対応済み一覧はブループリントと同期）
  var APPS = [
    { name:"変更届補助ツール",       short:"henko",       icon:true,  launcher:true  },
    { name:"業務日誌アプリ",         short:"nisshi",      icon:true,  launcher:false },
    { name:"かかりつけ薬剤師シール", short:"kakaritsuke", icon:true,  launcher:false },
    { name:"患者情報シール",         short:"kanja",       icon:true,  launcher:false },
    { name:"吸入指導手帳シール",     short:"inhale",      icon:true,  launcher:false },
    { name:"ポータル公開ページ",     short:"portal",      icon:true,  launcher:false },
    { name:"ヒヤリハット",           short:"hiyari",      icon:false, launcher:false },
    { name:"過誤報告",               short:"kago",        icon:false, launcher:false },
    { name:"勉強会記録",             short:"kenshu",      icon:true,  launcher:true  },
    { name:"処方箋枚数集計",         short:"shoho",       icon:true,  launcher:false },
    { name:"処方箋照合チェッカー",   short:"rx-checker",  icon:true,  launcher:false },
    { name:"法令文書配布",           short:"haihu",       icon:true,  launcher:true  },
    { name:"法令文書ビューワ",       short:"stove-teal",  icon:true,  launcher:true  },
    { name:"ファビコン一覧ビューア", short:"icons", iconName:"rabbit-coffee", icon:true, launcher:true },
    { name:"精算書アプリ",           short:"seisan",      icon:true,  launcher:true  },
    { name:"タイムカード集計",       short:"timecard",    icon:true,  launcher:true  }
  ];
  var BASE = "https://sanmi-dev.github.io/sanmi-apps/";

  document.getElementById("grid").innerHTML = APPS.map(function(a){
    var iconHtml = a.icon
      ? '<img class="icon" src="' + BASE + (a.iconName || a.short) + '-icon.png" alt="">'
      : '<div class="icon ph">?</div>';
    var badge = a.launcher
      ? '<span class="badge ok">● 公開済み</span>'
      : '<span class="badge no">未作成</span>';
    if (a.launcher) {
      return '<a class="card" href="' + BASE + a.short + '.html">' +
               iconHtml + '<div class="name">' + a.name + '</div>' + badge + '</a>';
    }
    return '<div class="card disabled">' +
             iconHtml + '<div class="name">' + a.name + '</div>' + badge + '</div>';
  }).join("");
</script>
</body>
</html>
