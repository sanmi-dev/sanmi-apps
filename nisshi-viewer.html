<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務日誌・ビューア</title>
<link rel="icon" type="image/png" href="https://sanmi-dev.github.io/sanmi-apps/nisshi-icon.png">
<link rel="apple-touch-icon" href="https://sanmi-dev.github.io/sanmi-apps/nisshi-icon.png">
<meta name="theme-color" content="#7a4a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日誌閲覧">
<style>
  :root{--accent:#7a4a2b;--bg:#f4ece0;--card:#fffaf3;--line:#e0d2be;--text:#3a2a1c;--muted:#8a7560;}
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  body{font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:360px;width:100%;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
  .icon{width:88px;height:88px;border-radius:20px;box-shadow:0 2px 10px rgba(122,74,43,.18)}
  h1{font-size:20px;margin:18px 0 6px}.sub{color:var(--muted);font-size:13px;margin-bottom:24px;line-height:1.6}
  .open{display:inline-block;width:100%;background:var(--accent);color:#fff;font-size:16px;font-weight:600;padding:14px 20px;border-radius:10px;text-decoration:none}
  .hint{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--muted);line-height:1.7;text-align:left}
  .redirecting{color:var(--muted);font-size:14px;margin-top:20px}
</style>
</head>
<body><div class="card">
  <img class="icon" src="https://sanmi-dev.github.io/sanmi-apps/nisshi-icon.png" alt="">
  <h1>業務日誌・ビューア</h1>
  <p class="sub">表紙・日次・一覧・月次の閲覧と印刷</p>
  <!-- 2026-08-04: 店舗用を ANYONE_ANONYMOUS / USER_DEPLOYING に変えたので URL を更新。
       旧: /a/macros/sanmi-g.com/s/.../exec  ← sanmi-g.com の人向けの入口。gmail では Google に弾かれる
       新: /macros/s/.../exec               ← Googleログイン不要の店舗用 @44
       正しい URL は Apps Script API の entryPoints[].webApp.url で確認できる。 -->
  <a class="open" id="openBtn" href="https://script.google.com/macros/s/AKfycbwFmPUawEh8ImneF6H6Hl1gnngY8k4CJvXH1jXn86GGBLwPL5qJMP8PTL9XrSzzxAYm/exec">ビューアを開く</a>
  <div class="hint" id="hint"><b>iPhone：</b>共有 → <b>ホーム画面に追加</b>。ホーム画面では「日誌閲覧」と表示されます。</div>
  <p class="redirecting" id="redirecting" style="display:none">ビューアを開いています…</p>
</div><script>
  var EXEC=document.getElementById('openBtn').getAttribute('href');
  var standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
  if(standalone){document.getElementById('hint').style.display='none';document.getElementById('redirecting').style.display='block';window.location.replace(EXEC);}
</script></body></html>
