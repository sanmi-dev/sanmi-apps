<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文書一括生成ツール</title>

<!-- ファビコン / ホーム画面アイコン -->
<link rel="icon" type="image/png" href="https://sanmi-dev.github.io/sanmi-apps/haihu-icon.png">
<link rel="apple-touch-icon" href="https://sanmi-dev.github.io/sanmi-apps/haihu-icon.png">
<meta name="msapplication-TileImage" content="https://sanmi-dev.github.io/sanmi-apps/haihu-icon.png">
<meta name="msapplication-TileColor" content="#1a73e8">
<meta name="theme-color" content="#1a73e8">

<!-- iOSでホーム画面から開いたときの見え方 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="文書生成">

<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
       background:#f8f9fa;color:#202124;
       display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:360px;width:100%;text-align:center;}
  .icon{width:88px;height:88px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.12);}
  h1{font-size:19px;margin:18px 0 4px;}
  .sub{color:#5f6368;font-size:13px;margin-bottom:24px;line-height:1.6;}
  .open{display:inline-block;width:100%;background:#1a73e8;color:#fff;border:none;
        font-size:16px;font-weight:600;padding:14px 20px;border-radius:10px;
        cursor:pointer;text-decoration:none;font-family:inherit;}
  .open:hover{background:#1765cc;}
  .hint{margin-top:22px;background:#fff;border:1px solid #dadce0;border-radius:10px;
        padding:14px 16px;font-size:12.5px;color:#5f6368;line-height:1.7;text-align:left;}
  .hint b{color:#202124;}
  .redirecting{color:#5f6368;font-size:14px;margin-top:20px;}
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="https://sanmi-dev.github.io/sanmi-apps/haihu-icon.png" alt="">
    <h1>文書一括生成ツール</h1>
    <p class="sub">安全指針・業務手順書を店舗ごとに一括生成</p>

    <a class="open" id="openBtn"
       href="https://script.google.com/macros/s/AKfycbw1_E8nmot8ofFWvCViedGCaKkiroDw2ssU4HqUz9IQfG5Fba3dw2p7yWisjvrOGtSj/exec">
       アプリを開く
    </a>

    <div class="hint" id="hint">
      <b>iPhone：</b>ホーム画面にアイコンを置くには、下の「共有」ボタン
      → <b>「ホーム画面に追加」</b>を選んでください。次回からこのアイコンで開けます。
    </div>
    <p class="redirecting" id="redirecting" style="display:none;">アプリを開いています…</p>
  </div>

<script>
  var EXEC = document.getElementById('openBtn').getAttribute('href');

  // ホーム画面から起動（standalone）した場合は、案内を出さず即アプリへ
  var standalone = window.navigator.standalone === true
                || window.matchMedia('(display-mode: standalone)').matches;

  if (standalone) {
    document.getElementById('hint').style.display = 'none';
    document.getElementById('redirecting').style.display = 'block';
    window.location.replace(EXEC);
  }
</script>
</body>
</html>
