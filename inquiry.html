<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問い合わせ — SANMI G.</title>
<link rel="icon" href="https://sanmi-dev.github.io/sanmi-apps/portal-icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{margin:0;background:transparent;}
  body{font-family:'Noto Sans JP',sans-serif;color:#2B2622;padding:8px 4px;}

  .wrap{max-width:560px;margin:0 auto;}

  .form-row{margin-bottom:14px;}
  .form-label{display:block;font-size:12px;letter-spacing:.08em;color:#A1876B;margin-bottom:6px;font-weight:500;}
  .form-app-display{background:#F4EEE2;border:1px solid rgba(111,78,55,.18);color:#5C4A3A;font-size:13.5px;padding:9px 12px;border-radius:6px;font-family:'Shippori Mincho',serif;}
  .form-input, .form-textarea{width:100%;background:#fff;border:1px solid rgba(111,78,55,.28);border-radius:6px;padding:10px 12px;font-size:14px;font-family:inherit;color:#2B2622;}
  .form-input:focus, .form-textarea:focus{outline:2px solid #6F4E37;outline-offset:-1px;border-color:transparent;}
  .form-textarea{resize:vertical;min-height:110px;line-height:1.7;}

  .submit-row{display:flex;align-items:center;gap:14px;margin-top:4px;flex-wrap:wrap;}
  .submit-btn{background:#6F4E37;color:#F7F1E4;font-weight:700;font-size:14px;padding:11px 28px;border-radius:8px;border:none;cursor:pointer;box-shadow:0 4px 10px rgba(111,78,55,.24);transition:background .2s ease;font-family:inherit;}
  .submit-btn:hover:not(:disabled){background:#5A3F2C;}
  .submit-btn:disabled{background:#B8A69A;cursor:not-allowed;box-shadow:none;}
  .submit-note{font-size:11.5px;color:#A1876B;letter-spacing:.04em;}

  .status{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:6px;line-height:1.6;display:none;}
  .status.show{display:block;}
  .status.ok{background:#EAF2E4;color:#3E5B33;border:1px solid rgba(74,110,52,.25);}
  .status.err{background:#F5E4E4;color:#7A3F3F;border:1px solid rgba(140,60,60,.25);}
</style>
</head>
<body>
<div class="wrap">
  <form id="inquiryForm">
    <div class="form-row">
      <label class="form-label">対象アプリ</label>
      <div class="form-app-display" id="appDisplay">読み込み中…</div>
    </div>
    <div class="form-row">
      <label class="form-label" for="belong">所属・店舗名</label>
      <input type="text" id="belong" name="belong" class="form-input" maxlength="60" placeholder="例：サンミ薬局、本部 など" required>
    </div>
    <div class="form-row">
      <label class="form-label" for="message">質問・要望</label>
      <textarea id="message" name="message" class="form-textarea" maxlength="2000" placeholder="ご質問やご要望をお聞かせください。" required></textarea>
    </div>
    <div class="submit-row">
      <button type="submit" class="submit-btn" id="submitBtn">送信</button>
      <span class="submit-note">開発元に届きます</span>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>
</div>
<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzvIpe4pMndmiXfv_PEzav6-zA13LyRVVUGZkdp_arrUmjK5WztZ3cOWc1oKZWuTeTJ/exec';
  const APP_NAMES = {
    portal: 'ポータルサイト',
    kakaritsuke: 'かかりつけ薬剤師シール',
    inhale: '吸入指導報告シール',
    patient: '患者情報シール',
    kenshu: '研修記録',
    henko: '変更届補助ツール'
  };

  (function() {
    const params = new URLSearchParams(location.search);
    const appKey = params.get('app') || '';
    const display = APP_NAMES[appKey] || (appKey || '（未指定）');
    const el = document.getElementById('appDisplay');
    el.textContent = display;
    el.dataset.appKey = appKey;
  })();

  const form = document.getElementById('inquiryForm');
  const status = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const appKey = document.getElementById('appDisplay').dataset.appKey || '';
    const belong = document.getElementById('belong').value.trim();
    const message = document.getElementById('message').value.trim();
    if (!belong || !message) return;

    if (GAS_URL === 'REPLACE_WITH_GAS_URL') {
      status.className = 'status show err';
      status.textContent = '⚠️ 送信先が未設定です（管理者に連絡してください）';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '送信中…';
    status.className = 'status';

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ app: appKey, belong: belong, message: message })
      });
      const data = await res.json();
      if (data.ok) {
        status.className = 'status show ok';
        status.textContent = '✅ 開発元に届きました。ありがとうございます。';
        form.reset();
        // 対象アプリ表示はリセットで消えないので再セット
        const el = document.getElementById('appDisplay');
        el.textContent = APP_NAMES[appKey] || (appKey || '（未指定）');
      } else {
        status.className = 'status show err';
        status.textContent = '⚠️ 送信できませんでした: ' + (data.error || '不明なエラー');
      }
    } catch (err) {
      status.className = 'status show err';
      status.textContent = '⚠️ 通信エラー: ' + err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '送信';
    }
  });
</script>
</body>
</html>
